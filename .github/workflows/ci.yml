# Continuous integration. No production secret is used or needed: the integration tests and the build run on
# a throw-away MongoDB (or on the *test* database in the TEST_DATABASE_URL secret, if you add one).
name: CI

on:
  pull_request:
  push:
    branches: [master, "security/**", "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The integration tests are skipped here (no database): the next job runs them and fails if they do not run.
      - run: npm test
      # Informational: known findings sit in the Prisma CLI / lint tooling (see the security report).
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  integration:
    name: Integration tests (required, test database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-8.0.4-${{ runner.os }}
      - run: npm ci
      # Fails when any integration test is skipped, missing or failing. TEST_DATABASE_URL is optional: without
      # it a MongoDB replica set is started on the runner; with it, it must name a *test* database
      # (scripts/test-db.mjs refuses anything else, and refuses the production DATABASE_URL).
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  build:
    name: Production build and build-output security checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-8.0.4-${{ runner.os }}
      - run: npm ci
      # Builds against a seeded throw-away database, then scans the output for secrets and source maps.
      - run: npm run ci:build
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
